name: lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:

  go-fmt:
    runs-on: ubuntu-latest
    steps:
    - name: checkout-code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: go-fmt
      run: |
        make go-fmt

    - name: check-is-dirty
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Detected uncommitted changes."
          git status
          git diff
          exit 1
        fi

  go-mod-tidy:
    runs-on: ubuntu-latest
    steps:
    - name: checkout-code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: go-mod-tidy
      run: |
        make go-mod-tidy

    - name: check-is-dirty
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Detected uncommitted changes."
          git status
          git diff
          exit 1
        fi

  go-vet:
    runs-on: ubuntu-latest
    steps:
    - name: checkout-code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: go-vet
      run: |
        make go-vet

    - name: check-is-dirty
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Detected uncommitted changes."
          git status
          git diff
          exit 1
        fi
